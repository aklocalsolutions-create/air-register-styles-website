<!doctype html><html><head><meta charset="utf-8"><title>DEMO - Style 37 Maroon Console - Preview</title>
<script src="../common/demo-data.js"></script><script src="../common/demo-ribbon.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;width:1366px;height:768px;overflow:hidden;background:#2b120d;font:13px 'Jura','Exo 2',sans-serif;color:#f2c98e;position:relative}
body[data-screen=sale] .pay,body[data-screen=pay] .sale,body:not([data-screen=cfd]) .cfd,body[data-screen=cfd] .op,body[data-screen=menu] .op,body:not([data-screen=menu]) .menu{display:none!important}
.a{position:absolute}
.f{font-family:'Jura','Exo 2',sans-serif;font-weight:700;letter-spacing:3px;text-transform:uppercase}
.mono{font-family:'DejaVu Sans Mono',monospace}
.tb{left:0;top:0;width:1366px;height:18px;background:linear-gradient(#e9d6ee,#cdb6d8);color:#3a2448;font:10.5px/18px 'Liberation Sans';padding:0 8px;white-space:nowrap;display:flex;gap:10px}
.tb .sp{flex:1}
.frame{left:4px;top:20px;width:1358px;height:722px;border:1.5px solid #d99aa6}
.np{position:absolute;left:16px;top:24px;font:700 22px 'Jura';letter-spacing:4px;color:#b3a4a0;white-space:nowrap;background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;gap:14px;align-items:baseline}
.np .k{font:12px 'DejaVu Sans Mono';letter-spacing:0;color:#8f7c76}
.tk{display:block;width:100%;background:#4c807a;border:0;padding:0 8px;text-align:left;color:#f6c88e;cursor:pointer;overflow:hidden;font-family:inherit}
.tk.big{height:42px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.tk.big .l{font:700 22px 'Jura';letter-spacing:4px;text-transform:uppercase;white-space:nowrap}
.tk.big .k{margin-left:auto;font:12px 'DejaVu Sans Mono';color:#e9e2c8;white-space:nowrap}
.tk.sm{height:27px;margin-bottom:2px;display:flex;flex-direction:column;justify-content:center;padding:0 6px}
.tk.sm .l{font:700 11px/1.1 'Jura';letter-spacing:1.2px;text-transform:uppercase;white-space:nowrap}
.tk.sm .k{font:9.5px/1.1 'DejaVu Sans Mono';color:#dfe6d6;white-space:nowrap}
.tk.red .l{color:#ffb4a0}
.lc{left:12px;top:58px;width:392px}
.lc .two{display:grid;grid-template-columns:1fr 1fr;column-gap:6px}
.cp{left:420px;top:58px;width:740px;height:678px;border:1.5px solid #cfc3c8}
.lh,.li{display:grid;grid-template-columns:70px 1fr 110px 110px;padding:0 18px;white-space:nowrap}
.lh{left:422px;top:66px;width:736px;font:700 12px 'Jura';letter-spacing:2px;color:#b9a19a;border-bottom:1px solid #6d4a44;height:24px;align-items:center}
.li{height:31px;align-items:center;font:700 16px 'Jura';letter-spacing:1.5px;color:#f2c98e;text-transform:uppercase}
.li span:nth-child(1),.li span:nth-child(n+3){text-align:right;font-family:'DejaVu Sans Mono';letter-spacing:0;font-weight:400}
.li span:nth-child(1){text-align:left}
.li.cur{background:#4a2018}
.eb{left:626px;top:512px;width:376px;height:40px;border:2px solid #e3a64a;display:flex;align-items:center;padding:0 10px;font:15px 'DejaVu Sans Mono';color:#f2c98e;white-space:nowrap}
.qsb{left:626px;top:560px;width:376px;height:26px;border:1px solid #9b6e36;display:flex;align-items:center;gap:8px;padding:0 8px;font:11px 'DejaVu Sans Mono';color:#cfae80;white-space:nowrap}
.qsb b{font:700 11px 'Jura';letter-spacing:1px;color:#f2c98e}.qsb .kk{margin-left:auto;color:#e3a64a}
.bb{background:#1f2fa8;color:#f4e3b6;padding:4px 10px;white-space:nowrap}
.bb .l{display:block;text-align:center;font:700 20px/1 'Jura';letter-spacing:4px}
.bb .v{display:block;font:700 24px/1.2 'Jura';letter-spacing:2px;margin-top:4px}
.rv{left:1176px;width:178px;height:52px;background:#4c807a;color:#f6c88e;padding:3px 8px;white-space:nowrap}
.rv .l{display:block;text-align:center;font:700 18px/1.1 'Jura';letter-spacing:3px}
.rv .v{display:block;font:700 19px/1.2 'Jura';letter-spacing:1.5px}
.rk{left:1176px;width:178px}
.leg{left:6px;top:744px;width:1354px;height:22px;background:#e6c7cf;color:#3a1e26;font:10.5px/22px 'Liberation Sans';padding:0 8px;white-space:nowrap;display:flex;gap:14px}
.leg b{font:700 10px 'DejaVu Sans Mono'}.leg .sp{flex:1}
.cfd{position:absolute;inset:0}
.menu{position:absolute;inset:0;background:#1418a6;font-family:'VT323',monospace;color:#dfe3ff;overflow:hidden}
.wall{position:absolute;left:-40px;top:52px;width:1460px;height:690px;color:#2a32d6;font:italic 700 22px/27px 'VT323';white-space:nowrap;overflow:hidden;opacity:.95}
.mh{left:0;top:18px;width:1366px;height:34px;display:flex;align-items:center;padding:0 22px;font:30px 'VT323';color:#e6e9ff;white-space:nowrap}
.mh .t{flex:1;text-align:center;letter-spacing:15px}
.mt{left:478px;top:62px;width:410px;height:30px;background:#7a2412;color:#ffd04a;font:28px/30px 'VT323';text-align:center;white-space:pre}
.mbox{left:478px;top:250px;width:410px;height:258px;background:#1418a6;border:2px solid #dfe3ff;box-shadow:22px 22px 0 #0b0b22;padding:12px 10px}
.mi{display:flex;height:28px;align-items:center;padding:0 10px;font:28px 'VT323';color:#e6e9ff;white-space:nowrap}
.mi .k{margin-left:auto;font-size:22px;color:#9fb0ff}
.mi.on{background:#8f3ab0;color:#ffe45a}.mi.on .k{color:#ffe45a}
.mf{left:0;top:738px;width:1366px;height:30px;text-align:center;font:26px/30px 'VT323';color:#dfe3ff}
.mf span{background:#5b63d8;color:#fff;padding:0 4px}
</style></head><body>
<div class="op" id="op"></div><div class="cfd" id="cfd"></div><div class="menu" id="menu"></div>
<script>const C=D.cust,L_=D.lines,m2=v=>v.toFixed(2);
const P=(x,y,w,h)=>`left:${x}px;top:${y}px${w!=null?';width:'+w+'px':''}${h!=null?';height:'+h+'px':''}`;
const div=(cls,x,y,w,h,html='',st='')=>`<div class="a ${cls}" style="${P(x,y,w,h)};${st}">${html}</div>`;
const tbar=t=>`<div class="a tb"><span>Air Register — ${D.store} · Register-1 · ${D.ver}</span><span>${t}</span><span class="sp"></span><span>–  ▢  ×</span></div><div class="a frame"></div>`;
const kb=k=>`<span class="l">${k.l}</span>${k.k?`<span class="k">${D.kc(k.k)}</span>`:''}`;
const leg=mid=>`<div class="a leg">${mid}<span class="sp"></span><span>● online</span><span>User: ${D.cashier}</span><span>Session ${D.session}</span><span>10/29/26 4:12 PM</span></div>`;
const BIG=[['t-payment','TENDER'],['g-gift','FS TEND'],['a-customer','ON ACNT'],['a-return','RETURNS'],['x-taxoff','WIC']];
const used=new Set([...BIG.map(b=>b[0]),'x-reprint']);
const rest=D.KEYS.filter(k=>!used.has(k.id)).map(k=>k.id);
const leftSm=rest.slice(0,30), rightSm=rest.slice(30);
const lc=`<div class="a lc">${BIG.map(([id])=>D.b(id,'tk big',kb)).join('')}<div class="two">${leftSm.map(id=>D.b(id,'tk sm',kb)).join('')}</div></div>`;
const rv=(y,l,v)=>div('rv',1176,y,null,null,`<span class="l">${l}</span><span class="v">${v}</span>`);
const bb=(x,w,l,v)=>div('bb',x,662,w,68,`<span class="l">${l}</span><span class="v">${v}</span>`);
const list=`<div class="a cp"></div><div class="a lh"><span>QTY</span><span>ITEM</span><span style="text-align:right">PRICE</span><span style="text-align:right">TOTAL</span></div>
<div class="a" style="${P(422,92,736,290)}">${L_.map((l,i)=>`<div class="li${i==L_.length-1?' cur':''}"><span>${l.q}</span><span>${l.n}</span><span>${m2(l.p)}</span><span>${m2(l.t)}</span></div>`).join('')}</div>`;
const sale=`<div class="sale">${tbar('Sale')}${D.b('x-reprint','np',k=>`<span>REPRINT</span><span class="k">${k.l} · ${D.kc(k.k)}</span>`)}
${lc}${list}
${div('eb',626,512,376,40,'_ <span style="color:#9b7a5a;margin-left:8px">Scan items....</span>')}
<div class="a qsb" data-qs="1"><b>${D.qs.title}</b>${D.qs.ph}<span class="kk">${D.qs.alt} · ${D.qs.k}</span></div>
${bb(440,230,'TOTAL',m2(D.total))}${bb(690,230,'SUBTOTAL',m2(D.sub))}${bb(940,200,'BEFORE TAX',m2(D.sub-D.disc))}
${rv(58,'ROWS',L_.length)}${rv(122,'DISCNT',m2(D.disc))}${rv(186,'TAX',m2(D.tax))}${rv(250,'QTY',D.count)}${rv(314,'STORE CR',m2(C.acct))}
${div('',1176,380,178,40,`<span style="font:700 11px 'Jura';letter-spacing:1.5px;color:#b9a19a">CUSTOMER</span><br><span style="font:700 13px 'Jura';letter-spacing:1px">${C.name.toUpperCase()}</span>`)}
<div class="a rk" style="top:430px">${rightSm.map(id=>D.b(id,'tk sm',kb)).join('')}</div>
${leg(D.legendHTML('  ·  '))}</div>`;
const PL=[['Credit Card','20.00','✔ paid'],['Cash','40.00','typed'],['Gift Card','',''],['Check','',''],['Store credit','','']];
const pk=(l,k,big,on)=>`<button class="tk ${big?'big':'sm'}"${on?' style="outline:2px solid #e3a64a"':''} data-pay="${l}"><span class="l">${l}</span><span class="k">${k}</span></button>`;
const pay=`<div class="pay" data-pay="1">${tbar('Payment')}<div class="a np">PAYMENT</div>
<div class="a lc">${PL.map((p,i)=>pk(p[0],p[1]||'—',1,i==1)).join('')}<div class="two">${D.PAY.quick.map(q=>pk(q,'quick cash')).join('')}</div>
<div style="height:8px"></div>${pk(D.PAY.ok,'Enter (when fully paid)',0)}${pk(D.PAY.back,'Esc — back to the sale',0)}
<div style="margin-top:12px;font:12px/21px 'Liberation Sans';color:#d9b98e">${D.PAY.keys.map(k=>`<b class="mono" style="display:inline-block;width:52px;color:#e3a64a">${k[0]}</b>${k[1]}`).join('<br>')}<br><span style="color:#a98f80">Store credit shows when a customer is on the sale.</span></div></div>
<div class="a cp"></div><div class="a lh"><span></span><span>PAYMENT LINE</span><span style="text-align:right">AMOUNT</span><span style="text-align:right">STATUS</span></div>
<div class="a" style="${P(422,92,736,200)}">${PL.map((p,i)=>`<div class="li${i==1?' cur':''}"><span>${i+1}</span><span>${p[0]}</span><span>${p[1]}</span><span style="font-family:'Jura';font-weight:700">${p[2]}</span></div>`).join('')}</div>
${div('eb',626,512,376,40,'40.00_ <span style="color:#9b7a5a;margin-left:8px">Cash</span>')}
${bb(440,230,'TOTAL',m2(D.total))}${bb(690,230,'BALANCE','0.00')}${bb(940,200,'CHANGE',m2(D.change))}
${rv(58,'DUE',m2(D.total))}${rv(122,'PAID','60.00')}${rv(186,'BALANCE','0.00')}${rv(250,'CHANGE',m2(D.change))}${rv(314,'ITEMS',L_.length+'/'+D.count)}
${leg('<span><b>Enter</b> next line / finish · <b>+</b> full balance · <b>Esc</b> back to sale</span>')}</div>`;
op.innerHTML=sale+pay;
cfd.innerHTML=`${tbar('customer view')}<div class="a np" style="color:#f2c98e">WELCOME, ${C.name.toUpperCase()} <span class="k" style="font-size:14px;color:#cfae80">${C.pts} points</span></div>
<div class="a cp" style="left:14px;width:1146px"></div>
<div class="a lh" style="left:16px;width:1142px;grid-template-columns:90px 1fr 170px 170px;font-size:14px;height:30px"><span>QTY</span><span>ITEM</span><span style="text-align:right">PRICE</span><span style="text-align:right">TOTAL</span></div>
<div class="a" style="${P(16,100,1142,400)}">${L_.map(l=>`<div class="li" style="height:42px;font-size:21px;grid-template-columns:90px 1fr 170px 170px"><span>${l.q}</span><span>${l.n}</span><span>${m2(l.p)}</span><span>${m2(l.t)}</span></div>`).join('')}</div>
${div('bb',40,600,560,126,`<span class="l" style="font-size:30px;line-height:1.1">TOTAL</span><span class="v" style="font-size:62px;text-align:center">${m2(D.total)}</span>`)}
${bb(630,250,'SUBTOTAL',m2(D.sub)).replace('top:662px','top:600px')}${bb(900,240,'TAX',m2(D.tax)).replace('top:662px','top:600px')}
${bb(630,510,'DISCOUNT',m2(D.disc)).replace('top:662px','top:684px').replace('height:68px','height:42px').replace('class="v"','class="v" style="display:none"').replace('<span class="l">DISCOUNT</span>','<span class="l" style="text-align:left;line-height:34px">DISCOUNT&nbsp;&nbsp; '+m2(D.disc)+'</span>')}
${rv(58,'ITEMS',L_.length)}${rv(122,'QTY',D.count)}${rv(186,'POINTS',C.pts)}
<div class="a leg" style="justify-content:center;font-weight:700">Thank you for shopping at ${D.store}</div>`;
const M=[['Sale (Items)','Esc'],['End of Day','Ctrl+E'],['Customer','F3'],['Price Check','Ctrl+I'],['History','Ctrl+L'],['Hardware Check','Ctrl+Shift+D'],['Printer & Drawer','Ctrl+,'],['Exit','Ctrl+Shift+Q']];
const wall=Array.from({length:26},(_,r)=>(r%2?'  ':'')+'— Air Register '.repeat(40)).join('<br>');
menu.innerHTML=`<div class="a tb"><span>Air Register — ${D.store} · Register-1 · ${D.ver}</span><span class="sp"></span><span>–  ▢  ×</span></div>
<div class="wall">${wall}</div>
<div class="a mh"><span>10/29/26</span><span class="t">=== Air Register ===</span><span>04:12:00 pm</span></div>
<div class="a mt">-=≡ *** MAIN MENU *** ≡=-</div>
<div class="a mbox">${M.map(([t,k],i)=>`<div class="mi${i==1?' on':''}">${t}<span class="k">${k}</span></div>`).join('')}</div>
<div class="a mf"><span>Key</span> Select — press the key shown on each line</div>`;
D.show();
</script></body></html>
